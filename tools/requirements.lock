# Python packages for GhostAgent's portable Python 3.14, pinned to exact wheels.
#
# tools\Build-GhostAgent.ps1 installs this file with
#   pip --isolated install --require-hashes --no-deps --only-binary=:all: --upgrade --target ... -r requirements.lock
# so pip installs exactly these files, checks each one against its SHA-256, ignores any pip
# settings on the build PC, and never resolves extra dependencies on its own.
#
# Each package lists two hashes: the Windows x64 wheel and the Windows ARM64 wheel. pip picks the
# one that matches the Python it runs in. Hashes were taken from the PyPI JSON API
# (https://pypi.org/pypi/<name>/<version>/json) and must be refreshed whenever a version changes.
#
# Playwright 1.65 depends only on greenlet. It no longer uses pyee, and it imports
# typing_extensions only for type checking, so neither is installed.
#
# When Playwright changes, also update the pinned Chromium (revision, version and SHA-256) in
# tools\Build-GhostAgent.ps1 to match the new package's driver\package\browsers.json; the build
# stops if they disagree.

playwright==1.65.1 \
