<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delayed content</title>
<link rel="stylesheet" href="/style.css">
<style>
  .spinner { width: 36px; height: 36px; border: 4px solid #ccd3db; border-top-color: #23395d; border-radius: 50%;
             animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
<h1>Delayed content</h1>
<div id="content"><div class="spinner" id="spinner"></div><p>Loading ...</p></div>
<script>
  // The real content arrives after ?ms=N (default 2000), with a spinner meanwhile.
  var ms = parseInt(new URLSearchParams(location.search).get('ms') || '2000', 10);
  setTimeout(function () {
    document.getElementById('content').innerHTML = '<p id="ready">The content has loaded. The answer is 42.</p>';
    document.title = 'Delayed content (loaded)';
  }, ms);
</script>
</main>
</body>
</html>
