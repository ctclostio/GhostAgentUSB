<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Click recorder</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; margin: 0; }
  #pad { position: fixed; inset: 0; background: repeating-linear-gradient(0deg, #fff, #fff 99px, #e3e8ee 99px, #e3e8ee 100px),
         repeating-linear-gradient(90deg, #fff, #fff 99px, #e3e8ee 99px, #e3e8ee 100px); background-blend-mode: multiply; }
  #log { position: fixed; left: 12px; top: 12px; background: rgba(255, 255, 255, .9); padding: 6px 10px; font-size: 15px; }
</style>
</head>
<body>
<div id="pad"></div>
<div id="log">Click anywhere. Clicks: none yet.</div>
<script>
  // Every click is recorded in window.clicks with its viewport position and the time between
  // mouse down and mouse up, so tests can check where (and how) a click landed.
  window.clicks = [];
  var down = 0;
  document.addEventListener('mousedown', function () { down = performance.now(); });
  document.addEventListener('click', function (e) {
    window.clicks.push({ x: e.clientX, y: e.clientY, detail: e.detail, button: e.button,
                         held_ms: Math.round(performance.now() - down) });
    document.getElementById('log').textContent = 'Clicks: ' + window.clicks.length + ', last at (' + e.clientX + ', ' + e.clientY + ')';
  });
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    window.clicks.push({ x: e.clientX, y: e.clientY, detail: 0, button: 2, held_ms: 0 });
  });
</script>
</body>
</html>
