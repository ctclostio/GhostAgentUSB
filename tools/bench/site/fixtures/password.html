<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Sign in</h1>
<form id="login" action="/submit/login" method="post">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" size="30">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" size="30">
  <label for="newpass">New password</label>
  <input id="newpass" name="newpass" autocomplete="new-password" size="30">
  <label for="otp">One-time code</label>
  <input id="otp" name="otp" autocomplete="one-time-code" inputmode="numeric" size="10">
  <p><button type="submit">Sign in</button></p>
</form>
</main>
</body>
</html>
